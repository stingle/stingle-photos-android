apply plugin: 'com.android.application'

// Creates a variable called keystorePropertiesFile, and initializes it to the
// keystore.properties file.
def keystorePropertiesFile = rootProject.file("keystore.properties")

// Initializes a new Properties() object called keystoreProperties.
def keystoreProperties = new Properties()

// Loads the keystore.properties file into the keystoreProperties object.
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))


android {
    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            keyAlias keystoreProperties['keyAlias']
            storePassword keystoreProperties['storePassword']
            keyPassword keystoreProperties['keyPassword']
        }
    }
    defaultConfig {
        applicationId "org.stingle.photos"
        minSdkVersion 23
        targetSdkVersion 35
        compileSdk 36
        versionCode 58
        versionName "2.12.0"
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            resValue "string", "app_name", "Stingle Photos"
            resValue "string", "camera", "Camera"
            resValue "string", "content_provider", "org.stingle.photos.share"
            resValue "string", "api_server_url", "https://api.stingle.org/"
            resValue "string", "default_home_folder_name", "StinglePhotos"
            buildConfigField "Boolean", "ALLOW_INSECURE_TLS", 'false'
            debuggable false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue "string", "content_provider", "org.stingle.photos.share.debug"
            resValue "string", "app_name", "Stingle Photos Dev"
            resValue "string", "camera", "Camera Dev"
            resValue "string", "api_server_url", "https://api.stingle.org/"
            resValue "string", "default_home_folder_name", "StinglePhotosDev"
            buildConfigField "Boolean", "ALLOW_INSECURE_TLS", 'true'
            debuggable true
        }
    }
    productFlavors {
        playstore {
            dimension 'version'
        }
        fdroid {
            dimension 'version'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    flavorDimensions 'version'

    buildFeatures {
        viewBinding true
    }
    namespace 'org.stingle.photos'
}

dependencies {
    // Native crypto. lazysodium 5.2.0 ships 16 KB-page-aligned libsodium.so (required
    // for Play updates) and bundles libsodium 1.0.20, which stays backward-compatible
    // with already-uploaded .sp files. JNA 5.17.0 (matching lazysodium's dependency)
    // ships a 16 KB-aligned libjnidispatch.so. Keep the @aar classifier so the native
    // libs are pulled in.
    implementation "com.goterl:lazysodium-android:5.2.0@aar"
    implementation 'net.java.dev.jna:jna:5.17.0@aar'

    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation "androidx.biometric:biometric:1.1.0"
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation "androidx.work:work-runtime:2.10.0"
    implementation project(path: ':picasso')

    playstoreImplementation 'com.android.billingclient:billing:7.1.1'

    // Media3 (formerly ExoPlayer 2.x). Custom decrypting DataSource lives in Video/.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'

    // CameraX (stable; 1.5.x ships 16 KB-aligned native libs)
    implementation "androidx.camera:camera-core:1.5.3"
    implementation "androidx.camera:camera-camera2:1.5.3"
    implementation "androidx.camera:camera-lifecycle:1.5.3"
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.camera:camera-video:1.5.3'
    implementation 'androidx.camera:camera-extensions:1.5.3'
    implementation 'androidx.window:window:1.3.0'
}
